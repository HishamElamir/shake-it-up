name: shake_it_up
description: "Shake your phone, let it pick for you."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State + dependency injection. Providers are overridable, which is how the
  # sensor stream and the RNG get faked in tests.
  flutter_riverpod: ^2.6.1

  # Accelerometer, gravity-compensated by the platform.
  sensors_plus: ^7.1.0

  # System photo picker and camera. Downscaling and EXIF handling come free,
  # which is why there is no image-processing dependency here.
  image_picker: ^1.2.3

  # App-private storage location.
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
